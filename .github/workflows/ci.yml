# Chasse aux bons plans — vérification, recette et publication sur GitHub Pages.
# Même chaîne que ParcPilote.
#
#   verify  : types, lint, tests unitaires, audit npm
#   build   : horaires réels (GTFS ouverts), PWA (dist/) et fichier unique (dist-single/) ; prépare l'artefact Pages sur main
#   e2e     : scénarios Playwright (métier et RGAA), captures en artefact
#   deploy  : publication GitHub Pages (push, lancement manuel ou rafraîchissement hebdomadaire, sur main uniquement)
#
# Pas de contournement : la recette navigateur est obligatoire pour publier.
#
# Sécurité : actions épinglées par empreinte (SHA) avec la version en commentaire,
# permissions minimales par job, aucun secret requis.

name: CI et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Chaque lundi à 5 h 17 UTC (6 h 17 l'hiver, 7 h 17 l'été à Paris) : audit des dépendances,
    # horaires à jour et republication si toute la chaîne est verte (sinon la version en ligne reste).
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  build:
    name: Construire
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pas de cache ici : ce job produit ce qui est publié.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest scripts/test_extraire_horaires.py
      # Horaires réels Marseille Saint-Charles <-> Paris (SNCF, Trenitalia) depuis transport.data.gouv.fr.
      # Sur une PR, une source indisponible n'empêche pas la vérification : l'échantillon versionné est gardé.
      # Sur main, pas d'horaires réels couvrant 4 semaines pour chaque source = pas de publication (la version en ligne reste).
      - name: Extraire les horaires
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if python scripts/extraire_horaires.py --sortie horaires-extraits.json > resume.json 2> erreur.txt \
             && python - <<'PY'
          import json, sys
          from datetime import date, timedelta
          d = json.load(open("horaires-extraits.json"))
          sens = {t["s"] for t in d["trains"]}
          ok = sens == {"MP", "PM"} and date.fromisoformat(d["fin"]) >= date.today() + timedelta(days=28) and date.fromisoformat(d["debut"]) <= date.today()
          print(f"période {d['debut']} → {d['fin']}, {len(d['trains'])} trains, sens {sorted(sens)}")
          sys.exit(0 if ok else 1)
          PY
          then
            mv horaires-extraits.json static/horaires.json
            echo "::notice title=Horaires publiés::$(cat resume.json | tr '\n' ' ')"
          elif [ "$EVENEMENT" = "pull_request" ]; then
            echo "::notice title=Horaires::source indisponible, échantillon versionné conservé pour cette vérification"
          else
            echo "::error title=Horaires::extraction impossible ou incomplète : $(tail -c 600 erreur.txt | tr '\n' ' ' | sed 's/::/: :/g')"
            exit 1
          fi
      # Le fichier qui sera publié passe par le validateur de l'appli : aucun train écarté, les deux créneaux servis.
      - run: npx vitest run tests/horaires-publies.test.ts
      - run: npm run build
      - run: npm run build:single
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds
          path: |
            dist/
            dist-single/
            node_modules/axe-core/axe.min.js
          retention-days: 7
          if-no-files-found: error
      - name: Préparer l'artefact GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    name: Recette navigateur
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: builds
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: python -m pip install --require-hashes -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python e2e/run_e2e.py --shots e2e-shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-captures
          path: e2e-shots/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Publier
    needs: [build, e2e]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.e2e.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publier le site sur GitHub Pages
      id-token: write # prouver l'origine du déploiement (jeton OIDC exigé par deploy-pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
